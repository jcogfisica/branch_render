databases:
  - name: django-db
    databaseName: django_db
    user: django_user
    plan: free

services:
  - type: web
    plan: free
    name: mysite
    runtime: python
    buildCommand: './build.sh'  # Certifique-se de que este arquivo existe no projeto e é executável
    startCommand: 'gunicorn Django1.wsgi:application --preload'  # migrate removido para evitar problemas em reinícios
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: RENDER
        value: 'TRUE'  # Necessário para identificar o ambiente de produção no settings.py